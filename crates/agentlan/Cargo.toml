[package]
name = "agentlan"
version = "0.2.0-beta.2"
edition = "2024"

[dependencies]
agentlan-hub = { version = "0.2.0-beta.2", path = "../agentlan-hub" }
agentlan-mcp = { version = "0.2.0-beta.2", path = "../agentlan-mcp" }
agentlan-net = { version = "0.2.0-beta.2", path = "../agentlan-net" }
agentlan-node = { version = "0.2.0-beta.2", path = "../agentlan-node" }
agentlan-proto = { version = "0.2.0-beta.2", path = "../agentlan-proto" }
agentlan-store = { version = "0.2.0-beta.2", path = "../agentlan-store" }
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive", "env"] }
directories = "6.0.0"
interprocess = { version = "2.4.10", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"
