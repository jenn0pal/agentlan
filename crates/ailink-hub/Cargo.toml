[package]
name = "ailink-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
ailink-net = { version = "0.1.0", path = "../ailink-net" }
ailink-proto = { version = "0.1.0", path = "../ailink-proto" }
ailink-store = { version = "0.1.0", path = "../ailink-store" }
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
data-encoding = "2.11.1"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
