[package]
name = "agentlan-hub"
version = "0.2.0-beta.1"
edition = "2024"

[dependencies]
agentlan-net = { version = "0.2.0-beta.1", path = "../agentlan-net" }
agentlan-proto = { version = "0.2.0-beta.1", path = "../agentlan-proto" }
agentlan-store = { version = "0.2.0-beta.1", path = "../agentlan-store" }
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
data-encoding = "2.11.1"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
