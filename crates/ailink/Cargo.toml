[package]
name = "ailink"
version = "0.1.0"
edition = "2024"

[dependencies]
ailink-hub = { version = "0.1.0", path = "../ailink-hub" }
ailink-mcp = { version = "0.1.0", path = "../ailink-mcp" }
ailink-net = { version = "0.1.0", path = "../ailink-net" }
ailink-node = { version = "0.1.0", path = "../ailink-node" }
ailink-proto = { version = "0.1.0", path = "../ailink-proto" }
ailink-store = { version = "0.1.0", path = "../ailink-store" }
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
directories = "6.0.0"
interprocess = { version = "2.4.10", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.154"
