name: Release

# Push a tag like v0.1.0 to build binaries for every platform, publish them as a
# GitHub Release (with SHA-256 checksums), then smoke-test the one-line installers.
# Run it manually (workflow_dispatch) for a dry run: builds + checksums, no publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        # musl targets: use the musl-gcc wrapper (native on each runner) for C code
        # such as the bundled SQLite, instead of relying on cc's compiler lookup.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentlan
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          t=${{ matrix.target }}
          d=target/$t/release
          cp README.md LICENSE-MIT LICENSE-APACHE "$d/"
          tar -C "$d" -czf "agentlan-$t.tar.gz" agentlan README.md LICENSE-MIT LICENSE-APACHE
          if command -v sha256sum >/dev/null; then sha256sum "agentlan-$t.tar.gz" > "agentlan-$t.tar.gz.sha256"; else shasum -a 256 "agentlan-$t.tar.gz" > "agentlan-$t.tar.gz.sha256"; fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = "${{ matrix.target }}"
          $d = "target/$t/release"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $d
          Compress-Archive -Path "$d/agentlan.exe", "$d/README.md", "$d/LICENSE-MIT", "$d/LICENSE-APACHE" -DestinationPath "agentlan-$t.zip"
          $h = (Get-FileHash "agentlan-$t.zip" -Algorithm SHA256).Hash.ToLower()
          # LF-terminated, like sha256sum output (SHA256SUMS is built by concatenation).
          [IO.File]::WriteAllText("$PWD/agentlan-$t.zip.sha256", "$h  agentlan-$t.zip`n")
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: agentlan-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Assemble and verify SHA256SUMS
        run: |
          cd dist
          # One line per artifact, whatever line endings each .sha256 has.
          for f in *.sha256; do tr -d '\r' < "$f"; echo; done | sed '/^$/d' > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # vX.Y.Z → normal release (becomes "latest"); vX.Y.Z-suffix → pre-release.
          case "$TAG" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          notes="Install (macOS/Linux): curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          Install (Windows PowerShell): irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
          Then: \`agentlan up\` on the server PC, \`agentlan connect <code>\` on the others. See the README."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" ./* --repo "${{ github.repository }}" --title "AgentLAN $TAG" --notes "$notes" $pre
          fi

  smoke:
    name: installer smoke test (${{ matrix.os }})
    needs: release
    # On a tag: test the release just published. On a manual dry run: test the
    # installers on this branch against the newest published release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      PIN: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          AGENTLAN_VERSION: ${{ env.PIN }}
          AGENTLAN_INSTALL_DIR: ${{ runner.temp }}/agl-bin
        run: |
          sh install.sh
          "$AGENTLAN_INSTALL_DIR/agentlan" --version
          "$AGENTLAN_INSTALL_DIR/agentlan" --help >/dev/null
      - name: SHA256SUMS verifies every artifact
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums && cd sums
          gh release download "$PIN" --repo "${{ github.repository }}"
          sha256sum -c SHA256SUMS
      - name: install.sh (unpinned "latest", as in the README one-liner)
        if: runner.os != 'Windows'
        env:
          AGENTLAN_INSTALL_DIR: ${{ runner.temp }}/agl-latest
        run: |
          sh install.sh
          "$AGENTLAN_INSTALL_DIR/agentlan" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENTLAN_VERSION: ${{ env.PIN }}
          AGENTLAN_INSTALL_DIR: ${{ runner.temp }}\agl-bin
        run: |
          ./install.ps1
          & "$env:AGENTLAN_INSTALL_DIR\agentlan.exe" --version
      - name: install.ps1 again while that agentlan.exe is running (upgrade in place)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENTLAN_VERSION: ${{ env.PIN }}
          AGENTLAN_INSTALL_DIR: ${{ runner.temp }}\agl-bin
          AGENTLAN_HOME: ${{ runner.temp }}\agl-home
        run: |
          $exe = "$env:AGENTLAN_INSTALL_DIR\agentlan.exe"
          $p = Start-Process -FilePath $exe -ArgumentList 'up', '--listen', '127.0.0.1:47820' -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\up.out" -RedirectStandardError "$env:RUNNER_TEMP\up.err"
          Start-Sleep -Seconds 3
          if ($p.HasExited) { Get-Content "$env:RUNNER_TEMP\up.err"; throw 'agentlan up exited early' }
          try {
            ./install.ps1
            & $exe --version
            if ($LASTEXITCODE -ne 0) { throw 'the new agentlan.exe did not run' }
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: install.ps1 (unpinned "latest", as in the README one-liner)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENTLAN_INSTALL_DIR: ${{ runner.temp }}\agl-latest
        run: |
          ./install.ps1
          & "$env:AGENTLAN_INSTALL_DIR\agentlan.exe" --version
