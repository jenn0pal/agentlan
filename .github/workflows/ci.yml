name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # End-to-end tests are Unix-only for now (Unix socket paths, `sh` scripts);
      # on Windows this runs the unit tests.
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy (errors only)
        run: cargo clippy --workspace --all-targets --locked
